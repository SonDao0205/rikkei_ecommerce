services:
  frontend:
    build:
      context: .
      dockerfile: frontend/project-ecommerce/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_BACKEND_HOST: ${VITE_BACKEND_HOST:-http://localhost:8080}
        VITE_APP_NAME: ${VITE_APP_NAME:-MarketPulse}
        VITE_APP_ENV: ${VITE_APP_ENV:-development}
        VITE_DEFAULT_AVATAR_SERVICE_URL: ${VITE_DEFAULT_AVATAR_SERVICE_URL:-https://ui-avatars.com/api/}
        VITE_SUPPORT_HOTLINE: ${VITE_SUPPORT_HOTLINE:-+84 1900 6868}
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-support@marketpulse.vn}
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ":8080"
      DATABASE_DSN: "${DB_USERNAME:?Cáº§n Ä‘áº·t DB_USERNAME}:${DB_PASSWORD:?Cáº§n Ä‘áº·t DB_PASSWORD}@tcp(mysql:3306)/${DB_NAME:-rikkei_ecommerce}?parseTime=true"
      JWT_SECRET: ${JWT_SECRET:?Cáº§n Ä‘áº·t JWT_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-168h}
      OTP_TTL: ${OTP_TTL:-10m}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    mem_limit: 600m
    mem_reservation: 300m
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Thiáº¿u biáº¿n MYSQL_ROOT_PASSWORD cho MySQL}"
      MYSQL_DATABASE: "${DB_NAME:?Thiáº¿u biáº¿n DB_NAME cho MySQL}"
      MYSQL_USER: "${DB_USERNAME:?Thiáº¿u biáº¿n DB_USERNAME cho MySQL}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?Thiáº¿u biáº¿n DB_PASSWORD cho MySQL}"
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/scriptDb.sql:/docker-entrypoint-initdb.d/01-scriptDb.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:-}"
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
