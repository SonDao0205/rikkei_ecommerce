services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Thiếu biến MYSQL_ROOT_PASSWORD cho MySQL}"
      MYSQL_DATABASE: "${DB_NAME:?Thiếu biến DB_NAME cho MySQL}"
      MYSQL_USER: "${DB_USERNAME:?Thiếu biến DB_USERNAME cho MySQL}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?Thiếu biến DB_PASSWORD cho MySQL}"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/scriptDb.sql:/docker-entrypoint-initdb.d/01-scriptDb.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:?Thiếu TUNNEL_TOKEN}"
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
